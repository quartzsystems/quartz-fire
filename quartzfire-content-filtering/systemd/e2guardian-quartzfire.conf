# QuartzFire hardening drop-in for e2guardian (ICAP server mode). Conservative:
# e2guardian must read /etc/e2guardian, its shipped lists + language templates,
# and write only its logs + runtime. Kept to protections proven not to break the
# stock daemon; tighten further only with an on-device smoke test.
[Unit]
Documentation=file:/usr/share/doc/quartzfire-content-filtering/design.md
# ICAP server is consumed by Squid; order after it is available.
After=network-online.target

[Service]
NoNewPrivileges=true
ProtectHome=true
ProtectSystem=full
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
RestrictSUIDSGID=true
# Logs + list swaps the updater performs live here; keep them writable under the
# stricter ProtectSystem=full.
ReadWritePaths=/var/log/e2guardian /var/lib/quartzfire/content-filtering
# ICAP is loopback-only.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
