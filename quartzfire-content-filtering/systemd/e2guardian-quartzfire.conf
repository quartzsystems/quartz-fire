# QuartzFire hardening drop-in for e2guardian (ICAP server mode). Conservative:
# e2guardian must read /etc/e2guardian, its shipped lists + language templates,
# and write only its logs + runtime. Kept to protections proven not to break the
# stock daemon; tighten further only with an on-device smoke test.
[Unit]
Documentation=file:/usr/share/doc/quartzfire-content-filtering/design.md
# ICAP server is consumed by Squid; order after it is available.
After=network-online.target
# Refuse to start unless qfcf-apply has rendered our ICAP config and dropped
# this marker (it does so only while `service content-filtering enable` is set).
# This is the load-bearing guard: without it, a stock-config e2guardian — the
# Debian package enables+starts it on install, and it can be re-enabled by
# hand or upgrade — comes up on its default `transparenthttpsport = 8443` and
# steals that port. The marker lives under /run (cleared each boot), so at boot
# e2guardian stays down until the config.boot replay runs qfcf-apply, renders
# the ICAP config (8443 blanked), and re-creates it. A failed condition is a
# clean skip, not a unit failure.
ConditionPathExists=/run/quartzfire-content-filtering/e2g-ready

[Service]
# The stock unit is Type=forking (GuessMainPID=no, no PIDFile), so systemd cannot
# reliably track a daemonised e2guardian — its ActiveState desyncs (reads
# inactive) while the reparented worker keeps the ICAP listener up. We run
# e2guardian in the FOREGROUND and track it as a simple service so
# `systemctl is-active` reflects reality.
#
# Foreground is forced with the `-N` command-line flag ("Do not go into the
# background"), NOT the `nodaemon = on` config directive: e2guardian 5.3.5
# (Debian bookworm) ignores that directive for backgrounding and forks anyway,
# so with the stock ExecStart the main process exits 0, the unit goes
# inactive(dead), and the apply's reload finds "No main process found" (exit 1).
# We therefore reset and override ExecStart to add -N; the stock ExecStart uses
# the default /etc/e2guardian/e2guardian.conf, which is what qfcf renders.
Type=simple
ExecStart=
ExecStart=/usr/sbin/e2guardian -N
NoNewPrivileges=true
ProtectHome=true
ProtectSystem=full
PrivateTmp=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
RestrictSUIDSGID=true
# Logs + list swaps the updater performs live here; keep them writable under the
# stricter ProtectSystem=full.
ReadWritePaths=/var/log/e2guardian /var/lib/quartzfire/content-filtering
# ICAP is loopback-only.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
