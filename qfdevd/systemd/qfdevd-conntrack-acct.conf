# Enable conntrack byte/packet accounting so qfdevd can attribute per-device
# usage from the conntrack counters. Without this, conntrack entries carry no
# bytes= fields and the Usage column stays empty.
#
# Installed to /usr/lib/sysctl.d/ by the qfdevd package; applied at boot by
# systemd-sysctl (and immediately on install by the postinst).
net.netfilter.nf_conntrack_acct = 1
