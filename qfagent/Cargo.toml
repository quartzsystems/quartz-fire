[package]
name = "qfagent"
description = "QuartzFire cloud management agent: device identity, QuartzCommand enrollment, and the persistent mTLS control channel."
version = "0.1.4"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["QuartzFire <cwellman@quartz.systems>"]
repository = "https://github.com/zagdrath/quartz-fire"

[[bin]]
name = "qfagent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
# Same tonic/prost line as qfappd so the two agents' gRPC stacks stay aligned.
# TLS deliberately does NOT use tonic's `tls` feature: the enrollment trust
# model (WebPKI first, token CA fingerprint pin as fallback) needs a custom
# rustls verifier, so connections are built with our own rustls config and
# handed to tonic through `connect_with_connector` (see src/tls.rs).
tonic = "0.11"
prost = "0.12"
# ReceiverStream: the outbound half of the ControlStream command channel.
tokio-stream = "0.1"
tower = { version = "0.4", features = ["util"] }
# Local management-API client for proxied console requests (loopback HTTP to
# quartzfire-webui; no TLS features needed).
reqwest = { version = "0.12", default-features = false }
# Parse /etc/quartzfire/webui.toml for the web UI's listen address + secrets.
toml = "0.8"
# Mint session tokens for the local web UI (shared HS256 signing secret).
jsonwebtoken = "9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
pem = "3"
# x509-parser feature: CSR parsing, used by the mock controller in tests.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
x509-parser = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"
# statvfs(3) for the DeviceStats disk-usage gauge — the one figure not exposed
# under /proc. Linux-only; the collector reports 0 for disk on other targets.
libc = "0.2"

[build-dependencies]
# protox is a pure-Rust protoc replacement: qfappd shells out to the protoc
# binary, but qfagent must also build `cargo test` on dev hosts without it
# (protoc is not installed on the Windows/WSL dev machines). protox 0.5 is the
# prost 0.12-compatible line.
tonic-build = "0.11"
protox = "0.5"
prost = "0.12"
prost-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-stream = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
